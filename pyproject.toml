[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenpulse-ai"
version = "1.3.0"
authors = [
  { name = "Sebastian Macias", email = "smacias@tokenpulse.ai" },
]
description = "Contador de tokens, auditoría multi-IDE y control de costes por proyecto de software con IA."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0"
]

[project.urls]
"Homepage" = "https://github.com/MaciasSM2/TokenPulse-AI"
"Bug Tracker" = "https://github.com/MaciasSM2/TokenPulse-AI/issues"

[project.scripts]
tokenpulse = "tokenpulse.cli:main"
tokenpulse-server = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tokenpulse*", "backend*"]
